<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cafe24 OAuth Callback</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #111; background: #fff; }
  h1 { font-size: 20px; }
  textarea { width: 100%; height: 110px; font-family: monospace; font-size: 13px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .err { color: #c00; }
  .muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h1 id="title">Cafe24 인증 결과</h1>
<p id="msg" class="muted">이 페이지는 OAuth 리다이렉트를 받는 용도입니다.</p>
<textarea id="url" readonly></textarea>
<button id="copy">전체 주소 복사</button>
<p class="muted">복사한 주소를 터미널의 <code>npm run auth</code> 입력창에 붙여넣으세요. 인증 코드는 1분 안에 써야 합니다.</p>
<script>
  const p = new URLSearchParams(location.search);
  const box = document.getElementById('url');
  const msg = document.getElementById('msg');
  box.value = location.href;
  if (p.get('error')) {
    msg.className = 'err';
    msg.textContent = '오류: ' + p.get('error') + ' ' + (p.get('error_description') || '');
  } else if (p.get('code')) {
    msg.textContent = '인증 코드를 받았습니다. 아래 주소를 복사하세요.';
  }
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(box.value); } catch { box.select(); document.execCommand('copy'); }
    document.getElementById('copy').textContent = '복사됨 ✓';
  };
</script>
</body>
</html>
